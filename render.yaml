services:
  - type: web
    name: sahaay-ai
    env: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: node server/src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
